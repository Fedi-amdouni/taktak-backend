server:
  port: ${PORT:8081}

spring:
  application:
    name: taktak-backend
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:true}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taktak_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
  data:
    jpa:
      repositories:
        # Keep the API health route available during a constrained container cold start.
        bootstrap-mode: lazy
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}

logging:
  level:
    com.taktak: ${TAKTAK_LOG_LEVEL:INFO}
    org.springframework.web.socket: INFO

taktak:
  mail:
    from: ${TAKTAK_MAIL_FROM:}
  orders:
    auto-archive-minutes: ${TAKTAK_ORDER_AUTO_ARCHIVE_MINUTES:5}
    archive-check-ms: ${TAKTAK_ORDER_ARCHIVE_CHECK_MS:60000}
  auth:
    secret: ${TAKTAK_AUTH_SECRET:taktak_super_secret_jwt_key_2026_dev_mode_secret}
    # Owner accounts: username:password:cafe-slug,cafe-slug. Set TAKTAK_OWNER_ACCOUNTS in shared environments.
    owner-accounts: ${TAKTAK_OWNER_ACCOUNTS:}
    # Temporary migration fallback when only the previous password setting exists.
    admin-password: ${TAKTAK_ADMIN_PASSWORD:wael123}
    token-ttl-hours: ${TAKTAK_TOKEN_TTL_HOURS:12}
